spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/synapse_dev
    username: dev_user
    password: dev_password

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    
ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
  
  groq:
    api-key: ${GROQ_API_KEY}

ratelimit:
  enabled: true

  ai:
    limit: 3
    window: 1m

  ai-daily:
    limit: 50
    window: 1d

  login:
    limit: 10
    window: 15m

  register:
    limit: 3
    window: 1h

  api:
    limit: 120
    window: 1m

jwt:
  issuer: synapse
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  secret: ${JWT_SECRET}

auth:
  refresh-cookie:
    secure: true
    same-site: None

springdoc:
  swagger-ui:
    default-models-expand-depth: 0