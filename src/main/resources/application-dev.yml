spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/synapse_dev
    username: dev_user
    password: dev_password

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    
ai:
  gemini:
    api-key: ${GEMINI_API_KEY}
  
  groq:
    api-key: ${GROQ_API_KEY}

ratelimit:
  enabled: true

  ai:
    limit: 3
    window: 1m

  ai-daily:
    limit: 50
    window: 1d

  login:
    limit: 10
    window: 15m

  register:
    limit: 3
    window: 1h

  verification-resend:
    limit: 3
    window: 1h

  email-change:
    limit: 3
    window: 1h

  api:
    limit: 120
    window: 1m

jwt:
  issuer: synapse
  access-token-ttl: 15m
  refresh-token-ttl: 30d
  secret: ${JWT_SECRET}

auth:
  refresh-cookie:
    secure: true
    same-site: None

  email-verification:
    frontend-url: ${EMAIL_VERIFICATION_URL:http://localhost:5173/verify-email}
    registration-token-ttl: 1h
    email-change-token-ttl: 24h
    unverified-retention: 7d
    cleanup-interval: 1h

email:
  resend:
    api-key: ${RESEND_API_KEY}
    from: ${RESEND_FROM:Synapse <no-reply@studysynapse.app>}
    api-url: ${RESEND_API_URL:https://api.resend.com/emails}
    connect-timeout: 5s
    read-timeout: 10s

springdoc:
  swagger-ui:
    default-models-expand-depth: 0
