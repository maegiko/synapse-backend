spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/synapse_dev
    username: dev_user
    password: dev_password

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    
ai:
  gemini:
    api-key: ${GEMINI_API_KEY}

jwt:
  issuer: synapse
  access-token-ttl: 15m
  secret: ${JWT_SECRET}