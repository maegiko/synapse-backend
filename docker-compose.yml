services:
  postgres:
    image: postgres:16
    container_name: synapse-postgres
    environment:
      POSTGRES_DB: synapse_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - synapse_postgres_data:/var/lib/postgresql/data

volumes:
  synapse_postgres_data: